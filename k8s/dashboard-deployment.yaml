apiVersion: apps/v1
kind: Deployment
metadata:
  name: internet-monitor-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internet-monitor-dashboard
  template:
    metadata:
      labels:
        app: internet-monitor-dashboard
    spec:
      containers:
        - name: dashboard
          image: internet-monitor:latest
          imagePullPolicy: Never
          command: ["python", "dashboard-internet.py"]
          ports:
            - containerPort: 8765
          envFrom:
            - configMapRef:
                name: internet-monitor-config
            - secretRef:
                name: internet-monitor-secret
          volumeMounts:
            - name: storage
              mountPath: /app/data
              subPath: data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: internet-monitor-pvc
